name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@f8faabf263f94a7a8508c5e57f1ff3752fa23915 # main
    with:
      # TODO: Add breaking check once we have a real version published to
      # compare against.
      checks: "changelog,do-not-submit,publish"
      fail_on: "changelog,do-not-submit,publish"
      warn_on: "license,coverage,breaking,leaking,unused-dependencies"
      flutter_packages: "pkgs/dart_mcp_server/test_fixtures/counter_app"
      sdk: dev
    permissions:
      pull-requests: write
