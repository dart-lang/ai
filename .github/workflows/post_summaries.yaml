# A CI configuration to write comments on PRs.

name: Comment on the pull request

on:
  workflow_run:
    workflows:
      - Health
      - Publish
    types:
      - completed

jobs:
  upload:
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@fc3dd9a17a8e18b3b4aa5abac8a0f4a679fe2d57
    permissions:
      pull-requests: write
