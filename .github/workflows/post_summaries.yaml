# A CI configuration to write comments on PRs.

name: Comment on the pull request
permissions:
  contents: read

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Health
    types:
      - completed

jobs:
  upload:
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@f8faabf263f94a7a8508c5e57f1ff3752fa23915 # main
    permissions:
      pull-requests: write
