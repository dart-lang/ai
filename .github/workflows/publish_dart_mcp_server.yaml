# A CI configuration to publish package:dart_mcp_server to pub.dev.

name: Publish package:dart_mcp_server

on:
  push:
    tags:
      - 'dart_mcp_server-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@a5bff6576dfc51b47eb77d4b7084bba6a4daf8d2 # main
    with:
      working-directory: pkgs/dart_mcp_server
      use-flutter: false
