# This workflow applies labels to pull requests based on the paths that are
# modified in the pull request.
#
# Edit `.github/labeler.yml` to configure labels. For more information, see
# https://github.com/actions/labeler.

name: Pull Request Labeler
permissions: read-all

on:
  pull_request_target

jobs:
  label:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
