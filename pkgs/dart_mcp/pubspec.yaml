name: dart_mcp
version: 0.6.0-wip
description: A package for making MCP servers and clients.
repository: https://github.com/dart-lang/ai/tree/main/pkgs/dart_mcp
issue_tracker: https://github.com/dart-lang/ai/issues?q=is%3Aissue+is%3Aopen+label%3Apackage%3Adart_mcp

environment:
  sdk: ^3.7.0

dependencies:
  async: ^2.13.0
  collection: ^1.19.1
  json_rpc_2: ">=3.0.3 <5.0.0"
  meta: ^1.16.0
  stream_channel: ^2.1.4
  stream_transform: ^2.1.1

dev_dependencies:
  dart_flutter_team_lints: ^3.2.1
  test: any

dependency_overrides:
  test:
    git:
      url: https://github.com/dart-lang/test.git
      ref: unawaited-socket-cancel
      path: pkgs/test
  test_api:
    git:
      url: https://github.com/dart-lang/test.git
      ref: unawaited-socket-cancel
      path: pkgs/test_api
  test_core:
    git:
      url: https://github.com/dart-lang/test.git
      ref: unawaited-socket-cancel
      path: pkgs/test_core
